<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>拯救心愛的寵物大作戰</title>
  <style>
    :root{
      --ink:#243447;
      --accent:#f7b500;
      --accent2:#ff8a00;
      --danger:#e94b6a;
      --track-width:5600px;
    }

    *{ box-sizing:border-box; }

    body{
      margin:0;
      font-family:"Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;
      color:var(--ink);
      background:linear-gradient(180deg,#eefbff 0%,#f7fcff 55%,#f3fff6 100%);
      overflow-x:hidden;
    }

    button{
      font-family:inherit;
      cursor:pointer;
      border:none;
    }

    .hidden{ display:none !important; }

    .screen{
      width:min(1180px,96vw);
      margin:0 auto;
      padding:14px 0;
    }

    .card{
      background:rgba(255,255,255,.94);
      border:3px solid #fff;
      border-radius:30px;
      box-shadow:0 18px 40px rgba(0,0,0,.12);
      padding:24px;
    }

    .title{
      margin:0 0 10px;
      text-align:center;
      font-size:clamp(2rem,5vw,4rem);
      line-height:1.08;
      font-weight:900;
    }

    .subtitle{
      max-width:980px;
      margin:0 auto 18px;
      text-align:center;
      line-height:1.8;
      font-size:1.1rem;
    }

    .hero-banner{
      position:relative;
      min-height:145px;
      margin:20px 0 24px;
      border-radius:30px;
      overflow:hidden;
      background:linear-gradient(180deg,#a6e7ff 0%,#fff0c9 58%,#7bc55a 59%,#67b34b 100%);
      border:4px solid #fff;
    }

    .cloud{
      position:absolute;
      background:rgba(255,255,255,.86);
      border-radius:999px;
      width:90px;
      height:40px;
      top:18px;
      animation:cloudMove 18s linear infinite;
    }

    .cloud:before,
    .cloud:after{
      content:"";
      position:absolute;
      background:rgba(255,255,255,.92);
      border-radius:50%;
    }

    .cloud:before{
      width:42px;
      height:42px;
      left:10px;
      top:-18px;
    }

    .cloud:after{
      width:52px;
      height:52px;
      right:10px;
      top:-24px;
    }

    .cloud.c2{
      top:72px;
      transform:scale(.9);
      animation-duration:23s;
      animation-delay:-7s;
    }

    @keyframes cloudMove{
      from{ left:-120px; }
      to{ left:calc(100% + 130px); }
    }

    .banner-char{
      position:absolute;
      left:28px;
      bottom:18px;
      display:flex;
      gap:18px;
      align-items:flex-end;
      filter:drop-shadow(0 8px 8px rgba(0,0,0,.18));
    }

    .girl-face,
    .boy-face{
      font-size:78px;
      line-height:1;
    }

    .banner-pet{
      position:absolute;
      left:62%;
      bottom:18px;
      font-size:78px;
      filter:drop-shadow(0 8px 8px rgba(0,0,0,.18));
      animation:petBounce 1s ease-in-out infinite alternate;
    }

    .banner-monster{
      position:absolute;
      right:9%;
      bottom:18px;
      width:86px;
      height:86px;
      filter:drop-shadow(0 8px 8px rgba(0,0,0,.18));
      animation:monsterFloat 1s ease-in-out infinite alternate;
      object-fit:contain;
    }

    @keyframes petBounce{
      from{ transform:translateY(0); }
      to{ transform:translateY(-8px); }
    }

    @keyframes monsterFloat{
      from{ transform:translateY(0) rotate(-2deg); }
      to{ transform:translateY(-10px) rotate(2deg); }
    }

    .selection-grid{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:20px;
      margin-top:10px;
    }

    .select-box h2{
      margin:0 0 12px;
      font-size:1.25rem;
    }

    .choice-row{
      display:grid;
      grid-template-columns:repeat(auto-fit,minmax(130px,1fr));
      gap:14px;
    }

    .choice{
      min-height:158px;
      padding:12px 10px 10px;
      border-radius:24px;
      background:#fff;
      border:4px solid transparent;
      box-shadow:0 10px 22px rgba(0,0,0,.08);
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:flex-start;
      gap:8px;
      text-align:center;
      transition:.18s ease;
      color:var(--ink);
      font-weight:900;
    }

    .choice:hover{
      transform:translateY(-3px);
      border-color:#ffd26c;
    }

    .choice.selected{
      border-color:var(--accent);
      background:#fff6dc;
    }

    .choice-img-wrap{
      width:78px;
      height:78px;
      display:flex;
      align-items:center;
      justify-content:center;
      flex:0 0 auto;
    }

    .choice-img{
      max-width:100%;
      max-height:100%;
      object-fit:contain;
      border-radius:18px;
      display:block;
    }

    .choice-emoji{
      font-size:3rem;
      line-height:1;
      width:78px;
      height:78px;
      display:flex;
      align-items:center;
      justify-content:center;
    }

    .choice-label{
      font-size:1rem;
      line-height:1.15;
      display:block;
    }

    .choice-type{
      display:block;
      font-size:.92rem;
      line-height:1.15;
      opacity:.9;
    }

    .start-btn,
    .restart-btn,
    .select-again-btn,
    .continue-btn{
      display:block;
      width:min(520px,100%);
      margin:26px auto 0;
      padding:16px 22px;
      border-radius:999px;
      color:#fff;
      font-size:1.15rem;
      font-weight:900;
      background:linear-gradient(135deg,var(--accent),var(--accent2));
      box-shadow:0 12px 26px rgba(255,138,0,.28);
    }

    .select-again-btn{
      margin-top:12px;
      background:linear-gradient(135deg,#32c2ff,#1475d3);
    }

    .footer-note{
      text-align:center;
      margin-top:14px;
      opacity:.8;
      font-size:1rem;
    }

    .sound-btn{
      position:fixed;
      right:16px;
      bottom:16px;
      z-index:1000;
      min-width:138px;
      padding:12px 16px;
      border-radius:999px;
      font-size:1rem;
      font-weight:900;
      color:#48606f;
      background:rgba(255,255,255,.82);
      border:3px solid rgba(255,255,255,.95);
      box-shadow:0 10px 25px rgba(0,0,0,.12);
      opacity:.78;
      backdrop-filter:blur(4px);
    }

    .sound-btn:hover{
      opacity:1;
      background:rgba(255,248,222,.92);
    }

    #gameScreen{
      min-height:100vh;
      display:flex;
      flex-direction:column;
      gap:10px;
    }

    .hud{
      display:grid;
      grid-template-columns:1fr 1fr 1fr;
      gap:12px;
    }

    .hud-item{
      background:rgba(255,255,255,.9);
      border:3px solid #fff;
      border-radius:22px;
      padding:12px 14px;
      box-shadow:0 8px 20px rgba(0,0,0,.08);
      font-weight:900;
      text-align:center;
      display:flex;
      align-items:center;
      justify-content:center;
    }

    .lives{
      font-size:1.45rem;
      letter-spacing:.04em;
      white-space:nowrap;
      text-align:center;
    }

    .stage-text{
      text-align:center;
      white-space:nowrap;
      font-size:1.15rem;
    }

    .hint-text{
      text-align:center;
      line-height:1.4;
      font-size:1.15rem;
      white-space:nowrap;
    }

    .world-wrap{
      position:relative;
      flex:1 1 auto;
      min-height:0;
      border-radius:30px;
      overflow:hidden;
      border:4px solid #fff;
      box-shadow:0 18px 40px rgba(0,0,0,.12);
      background:#b9efff;
    }

    .world-viewport{
      position:relative;
      height:70vh;
      min-height:440px;
      overflow:hidden;
      background:linear-gradient(180deg,#a3e6ff 0%,#dff6ff 42%,#89cb64 43%,#61b448 100%);
    }

    .world-track{
      position:absolute;
      left:0;
      top:0;
      width:var(--track-width);
      height:100%;
      transition:transform 4.8s cubic-bezier(.2,.7,.2,1);
      will-change:transform;
      background:
        radial-gradient(circle at 700px 90px,rgba(255,255,255,.9) 0 46px,transparent 47px),
        radial-gradient(circle at 2100px 76px,rgba(255,255,255,.82) 0 50px,transparent 51px),
        radial-gradient(circle at 3900px 90px,rgba(255,255,255,.86) 0 46px,transparent 47px),
        linear-gradient(180deg,#a3e6ff 0%,#dff6ff 42%,#89cb64 43%,#61b448 100%);
    }

    .hill{
      position:absolute;
      bottom:112px;
      border-radius:50% 50% 0 0;
      background:rgba(78,170,78,.5);
    }

    .h1{ left:120px; width:330px; height:140px; }
    .h2{ left:1200px; width:420px; height:180px; }
    .h3{ left:2300px; width:360px; height:160px; }
    .h4{ left:3500px; width:430px; height:200px; }
    .h5{ left:4550px; width:390px; height:170px; }

    .path-line{
      position:absolute;
      left:70px;
      right:90px;
      bottom:120px;
      height:8px;
      border-radius:999px;
      background:repeating-linear-gradient(90deg,rgba(255,255,255,.75) 0 46px,transparent 46px 74px);
    }

    .ground{
      position:absolute;
      left:0;
      right:0;
      bottom:0;
      height:116px;
      background:
        linear-gradient(90deg,rgba(255,255,255,.18) 25%,transparent 25%) 0 0 / 46px 18px,
        linear-gradient(180deg,#76c45a 0%,#509d38 100%);
      border-top:8px solid rgba(255,255,255,.55);
    }

    .checkpoint{
      position:absolute;
      bottom:125px;
      width:6px;
      height:58px;
      background:#fff;
      border-radius:999px;
      box-shadow:0 8px 18px rgba(0,0,0,.12);
    }

    /* 關卡字牌：插在棍子上，水平置中 */
    .flag-board{
      position:absolute;
      left:50%;
      top:-28px;
      transform:translateX(-50%);
      min-width:96px;
      padding:7px 14px;
      background:linear-gradient(180deg,#fffef8 0%,#fff1b8 100%);
      color:#4f5560;
      border:3px solid #ffffff;
      border-radius:12px;
      font-size:.82rem;
      font-weight:900;
      line-height:1.1;
      text-align:center;
      box-shadow:0 8px 16px rgba(0,0,0,.12);
      white-space:nowrap;
      display:flex;
      align-items:center;
      justify-content:center;
    }

    .flag-board::before{
      display:none;
    }

    .flag-board::after{
      content:"";
      position:absolute;
      left:50%;
      bottom:-12px;
      transform:translateX(-50%);
      width:8px;
      height:12px;
      background:#fff;
      border-radius:0 0 4px 4px;
      box-shadow:0 2px 0 rgba(0,0,0,.04);
    }

    .actor,
    .monster,
    .pet-cage{
      position:absolute;
      transform-origin:center bottom;
      user-select:none;
    }

    .actor{
      left:100px;
      bottom:104px;
      width:110px;
      height:110px;
      z-index:10;
      transition:left 4.8s cubic-bezier(.2,.7,.2,1);
      filter:drop-shadow(0 10px 8px rgba(0,0,0,.16));
    }

    .actor.walking{
      animation:runBounce .34s ease-in-out infinite alternate;
    }

    .actor.attacking{
      animation:attackMove 1.5s ease-in-out 1;
    }

    .actor.hurt{
      animation:hurtShake .38s linear 8;
    }

    .actor.rescue{
      animation:happyJump .45s ease-in-out infinite alternate;
    }

    .actor-visual{
      position:absolute;
      inset:0;
      display:flex;
      align-items:flex-end;
      justify-content:center;
    }

    .actor-visual img{
      max-width:100%;
      max-height:100%;
      object-fit:contain;
      display:block;
    }

    .actor-visual .emoji-hero{
      font-size:92px;
      line-height:1;
    }

    .sword{
      position:absolute;
      left:64%;
      top:18%;
      font-size:48px;
      opacity:0;
      z-index:20;
      transform-origin:25% 85%;
      pointer-events:none;
    }

    .actor.attacking .sword{
      opacity:1;
      animation:swordSlash 1.5s ease-in-out 1;
    }

    @keyframes runBounce{
      from{ transform:translateY(0) rotate(-2deg); }
      to{ transform:translateY(-11px) rotate(2deg); }
    }

    @keyframes attackMove{
      0%{ transform:translateX(0) rotate(0); }
      30%{ transform:translateX(10px) rotate(-2deg); }
      55%{ transform:translateX(32px) rotate(-4deg); }
      72%{ transform:translateX(58px) rotate(-6deg); }
      100%{ transform:translateX(0) rotate(0); }
    }

    @keyframes swordSlash{
      0%{ transform:translateX(0) rotate(-80deg) scale(.92); opacity:0; }
      15%{ opacity:1; }
      42%{ transform:translateX(34px) rotate(-18deg) scale(1.08); opacity:1; }
      68%{ transform:translateX(108px) rotate(42deg) scale(1.5); opacity:1; }
      100%{ transform:translateX(0) rotate(90deg) scale(.7); opacity:0; }
    }

    @keyframes hurtShake{
      0%,100%{ transform:translateX(0); }
      25%{ transform:translateX(-10px); }
      50%{ transform:translateX(10px); }
      75%{ transform:translateX(-6px); }
    }

    @keyframes happyJump{
      from{ transform:translateY(0) scale(1); }
      to{ transform:translateY(-18px) scale(1.04); }
    }

    .monster{
      bottom:100px;
      z-index:8;
      animation:monsterIdle 1s ease-in-out infinite alternate;
      filter:drop-shadow(0 12px 8px rgba(0,0,0,.18));
    }

    .monster.hit{
      animation:monsterHit 1.1s linear 1;
    }

    .monster.attacking{
      animation:monsterAttack 3s ease-in-out 1;
    }

    .monster.dead{
      animation:monsterDie .45s ease-out forwards;
      pointer-events:none;
    }

    .monster.dead .monster-visual{
      filter:grayscale(.45) saturate(.65);
    }

    @keyframes monsterIdle{
      from{ transform:translateY(0) rotate(-2deg); }
      to{ transform:translateY(-12px) rotate(2deg); }
    }

    @keyframes monsterHit{
      0%,100%{ transform:translateX(0) scale(1); }
      20%{ transform:translateX(18px) scale(.96); }
      40%{ transform:translateX(-18px) scale(1.04); }
      60%{ transform:translateX(12px) scale(.98); }
      80%{ transform:translateX(-8px) scale(1.02); }
    }

    @keyframes monsterAttack{
      0%{ transform:translateX(0) translateY(0) scale(1); }
      20%{ transform:translateX(-52px) translateY(-8px) scale(1.08); }
      35%{ transform:translateX(-112px) translateY(0) scale(1.15); }
      50%{ transform:translateX(-88px) translateY(-8px) scale(1.1); }
      65%{ transform:translateX(-126px) translateY(0) scale(1.16); }
      100%{ transform:translateX(0) translateY(0) scale(1); }
    }

    @keyframes monsterDie{
      0%{ opacity:1; transform:translateY(0) rotate(0deg) scale(1); }
      100%{ opacity:.72; transform:translateY(10px) rotate(90deg) scale(.95); }
    }

    .monster-visual{
      position:relative;
      width:138px;
      height:138px;
      display:flex;
      align-items:center;
      justify-content:center;
      font-size:86px;
      line-height:1;
      border-radius:50%;
    }

    .monster-visual img{
      width:100%;
      height:100%;
      object-fit:contain;
      display:block;
    }

    .monster-name{
      position:absolute;
      left:50%;
      top:-38px;
      transform:translateX(-50%);
      white-space:nowrap;
      font-size:.94rem;
      font-weight:900;
      background:#fff;
      padding:6px 12px;
      border-radius:999px;
      box-shadow:0 8px 16px rgba(0,0,0,.1);
    }

    .hp-box{
      position:absolute;
      left:50%;
      top:-66px;
      transform:translateX(-50%);
      width:150px;
      height:16px;
      background:rgba(255,255,255,.92);
      border:2px solid #fff;
      border-radius:999px;
      overflow:hidden;
      box-shadow:0 8px 16px rgba(0,0,0,.1);
    }

    .hp-fill{
      height:100%;
      width:100%;
      background:linear-gradient(90deg,#19b46b,#ffd166,#ef476f);
      transition:width .35s ease;
    }

    .pet-cage{
      left:5120px;
      bottom:96px;
      width:108px;
      height:120px;
      z-index:7;
      filter:drop-shadow(0 10px 8px rgba(0,0,0,.18));
    }

    .pet-inner{
      position:absolute;
      inset:0;
      display:flex;
      align-items:flex-end;
      justify-content:center;
      font-size:72px;
      line-height:1;
    }

    .cage-bars{
      position:absolute;
      inset:0;
      border:5px solid #77502a;
      border-radius:20px;
      background:repeating-linear-gradient(90deg,transparent 0 18px,rgba(119,80,42,.72) 18px 23px);
      transition:.45s ease;
    }

    .pet-cage.open .cage-bars{
      transform:rotate(-28deg) translate(-34px,-28px);
      opacity:0;
    }

    .toast{
      position:absolute;
      left:50%;
      top:18px;
      transform:translateX(-50%);
      z-index:18;
      max-width:min(720px,88vw);
      padding:10px 16px;
      text-align:center;
      font-weight:900;
      border-radius:999px;
      background:rgba(255,255,255,.94);
      border:3px solid #fff;
      box-shadow:0 10px 22px rgba(0,0,0,.12);
      opacity:0;
      transition:.24s ease;
    }

    .toast.show{
      opacity:1;
      transform:translateX(-50%) translateY(6px);
    }

    .heart-loss{
      position:absolute;
      left:50%;
      top:46%;
      transform:translate(-50%,-50%);
      z-index:40;
      padding:18px 28px;
      font-size:clamp(3rem,8vw,6rem);
      color:#d81f4e;
      font-weight:1000;
      border-radius:28px;
      background:rgba(255,255,255,.95);
      border:5px solid #ffd0dd;
      box-shadow:0 20px 55px rgba(233,75,106,.34);
      pointer-events:none;
    }

    .heart-loss.show{
      animation:heartPop 3s ease-in-out 1 both;
    }

    @keyframes heartPop{
      0%{ opacity:0; transform:translate(-50%,-50%) scale(.4) rotate(-8deg); }
      10%{ opacity:1; transform:translate(-50%,-50%) scale(1.25) rotate(6deg); }
      55%{ opacity:1; transform:translate(-50%,-56%) scale(1.08); }
      100%{ opacity:0; transform:translate(-50%,-80%) scale(.82); }
    }

    .progress-strip{
      position:absolute;
      left:18px;
      right:18px;
      bottom:14px;
      z-index:20;
      display:flex;
      gap:8px;
      pointer-events:none;
    }

    .progress-dot{
      flex:1;
      height:10px;
      border-radius:999px;
      background:rgba(255,255,255,.55);
      border:1px solid rgba(255,255,255,.9);
      overflow:hidden;
    }

    .progress-dot span{
      display:block;
      height:100%;
      width:0;
      background:linear-gradient(90deg,#ffd166,#19b46b);
      transition:width .4s ease;
    }

    .progress-dot.done span{ width:100%; }
    .progress-dot.current span{ width:55%; }

    .modal-backdrop{
      position:fixed;
      inset:0;
      z-index:999;
      display:grid;
      place-items:center;
      padding:18px;
      background:rgba(27,38,50,.5);
      backdrop-filter:blur(5px);
    }

    .modal{
      width:min(760px,96vw);
      max-height:90vh;
      overflow:auto;
      background:rgba(255,255,255,.97);
      border-radius:28px;
      padding:24px;
      border:4px solid #fff;
      box-shadow:0 24px 70px rgba(0,0,0,.22);
    }

    .modal h2{
      margin:0 0 10px;
      font-size:1.6rem;
    }

    .situation{
      background:#f1fbff;
      border-left:7px solid #48cae4;
      border-radius:16px;
      padding:13px 15px;
      line-height:1.8;
      margin:14px 0;
    }

    .question-title{
      font-size:1.15rem;
      font-weight:900;
      line-height:1.7;
      margin:10px 0;
    }

    .answers{
      display:grid;
      gap:10px;
      margin-top:14px;
    }

    .answer-btn{
      text-align:left;
      padding:14px 15px;
      border-radius:18px;
      background:#fff;
      color:var(--ink);
      border:3px solid #edf2f4;
      font-size:1rem;
      font-weight:800;
      transition:.16s ease;
    }

    .answer-btn:hover{
      transform:translateX(4px);
      border-color:#ffd166;
      background:#fff9df;
    }

    .feedback{
      line-height:1.9;
      font-size:1.02rem;
    }

    .feedback.good strong{ color:#0c9a5f; }
    .feedback.bad strong{ color:#ce2d4f; }

    .edu-point{
      margin-top:12px;
      padding:13px 15px;
      border-radius:18px;
      background:#fff8d7;
      border-left:7px solid var(--accent);
    }

    .end-screen{
      text-align:center;
    }

    .end-emoji{
      font-size:clamp(3rem,7vw,5rem);
      margin:10px 0 12px;
    }

    .end-screen h1{
      margin:0 0 12px;
      font-size:clamp(2rem,5vw,3.3rem);
    }

    .end-screen p{
      max-width:760px;
      margin:0 auto;
      line-height:1.9;
      font-size:1.08rem;
    }

    .victory-scene{
      position:relative;
      width:min(620px,92vw);
      min-height:230px;
      margin:8px auto 18px;
      border-radius:30px;
      background:linear-gradient(180deg,#e8fbff 0%,#fff7d6 58%,#b9ef93 59%,#77c96a 100%);

    function initAudio(){
      if(!audio.enabled) return;
      const AC = window.AudioContext || window.webkitAudioContext;
      if(!AC) return;

      if(!audio.ctx){
        audio.ctx = new AC();
        audio.master = audio.ctx.createGain();
        audio.musicGain = audio.ctx.createGain();
        audio.sfxGain = audio.ctx.createGain();

        audio.master.gain.value = .98;
        audio.musicGain.gain.value = .55;
        audio.sfxGain.gain.value = .46;

        audio.musicGain.connect(audio.master);
        audio.sfxGain.connect(audio.master);
        audio.master.connect(audio.ctx.destination);
      }

      if(audio.ctx.state === "suspended"){
        audio.ctx.resume();
      }
    }

    function updateSoundButton(){
      dom.soundBtn.textContent = audio.enabled ? "🔊 音效開" : "🔇 靜音";

        audio.musicTimer = null;
      }
      if(audio.victoryTimer){
        clearInterval(audio.victoryTimer);
        audio.victoryTimer = null;
      }
    }

    function stopAllNodes(){
      audio.activeNodes.forEach(node=>{
        try{
          if(node.gain && audio.ctx){
            const now = audio.ctx.currentTime;
            node.gain.gain.cancelScheduledValues(now);
            node.gain.gain.setValueAtTime(.0001,now);
          }
          if(node.osc) node.osc.stop(0);
        }catch(e){}
      });
      audio.activeNodes = [];
    }

    function muteImmediately(){
      clearAudioTimers();
      stopAllNodes();

      if(audio.ctx && audio.master){
        const now = audio.ctx.currentTime;
        audio.master.gain.cancelScheduledValues(now);
        audio.master.gain.setValueAtTime(0,now);
      }

      if(audio.ctx){
        const old = audio.ctx;
        audio.ctx = null;
        audio.master = null;
        audio.musicGain = null;
        audio.sfxGain = null;
        old.close().catch(()=>{});
      }

      audio.nextMusicTime = 0;
      audio.nextVictoryTime = 0;
    }

    function unmuteImmediately(){
      initAudio();
      if(audio.ctx && audio.master){
        const now = audio.ctx.currentTime;
        audio.master.gain.cancelScheduledValues(now);
        audio.master.gain.setValueAtTime(.98,now);
      }
      audio.nextMusicTime = 0;
      audio.nextVictoryTime = 0;

    function makeEnv(targetGain,startTime,duration,destination){
      const gain = audio.ctx.createGain();
      gain.gain.setValueAtTime(.0001,startTime);
      gain.gain.exponentialRampToValueAtTime(Math.max(targetGain,.0002),startTime + .018);
      gain.gain.exponentialRampToValueAtTime(.0001,startTime + duration);
      gain.connect(destination);
      return gain;
    }

    function scheduleTone(freq,startTime,duration,type,gainValue,destination){
      if(!audio.enabled) return;
      initAudio();
      if(!audio.ctx) return;

      const osc = audio.ctx.createOscillator();
      const gain = makeEnv(gainValue || .12,startTime,duration,destination || audio.sfxGain);

      osc.type = type || "sine";
      osc.frequency.setValueAtTime(freq,startTime);
      osc.connect(gain);
      osc.start(startTime);
      osc.stop(startTime + duration + .04);

      audio.activeNodes.push({osc,gain});
    }

    function playTone(freq,duration,type,gainValue,delay=0){
      if(!audio.enabled) return;
      initAudio();
      if(!audio.ctx) return;
      scheduleTone(freq,audio.ctx.currentTime + delay,duration,type,gainValue,audio.sfxGain);
    }

    function playGlide(startFreq,endFreq,duration,type,gainValue,delay=0){
      if(!audio.enabled) return;
      initAudio();
      if(!audio.ctx) return;

      const now = audio.ctx.currentTime + delay;
      const osc = audio.ctx.createOscillator();
      const gain = makeEnv(gainValue || .18,now,duration,audio.sfxGain);

      osc.type = type || "sawtooth";
      osc.frequency.setValueAtTime(startFreq,now);
      osc.frequency.exponentialRampToValueAtTime(endFreq,now + duration);
      osc.connect(gain);
      osc.start(now);
      osc.stop(now + duration + .04);

      audio.activeNodes.push({osc,gain});
    }

    function scheduleMusicNote(freq,startTime,duration,type,gainValue){
      if(!audio.ctx || !audio.musicGain) return;

      const osc = audio.ctx.createOscillator();
      const gain = makeEnv(gainValue,startTime,duration,audio.musicGain);

      osc.type = type;
      osc.frequency.setValueAtTime(freq,startTime);
      osc.connect(gain);
      osc.start(startTime);
      osc.stop(startTime + duration + .04);

      audio.activeNodes.push({osc,gain});
    }

    function scheduleDrum(startTime,kind){
      if(!audio.ctx || !audio.musicGain) return;

      const osc = audio.ctx.createOscillator();
      const gain = audio.ctx.createGain();

      osc.type = kind === "hat" ? "square" : "sine";

      const startFreq = kind === "kick" ? 120 : kind === "snare" ? 210 : 820;
      const endFreq = kind === "kick" ? 46 : kind === "snare" ? 120 : 620;
      const duration = kind === "hat" ? .045 : .12;
      const volume = kind === "kick" ? .20 : kind === "snare" ? .10 : .035;

      osc.frequency.setValueAtTime(startFreq,startTime);
      osc.frequency.exponentialRampToValueAtTime(endFreq,startTime + duration);

      gain.gain.setValueAtTime(.0001,startTime);
      gain.gain.exponentialRampToValueAtTime(volume,startTime + .01);
      gain.gain.exponentialRampToValueAtTime(.0001,startTime + duration);

      osc.connect(gain);
      gain.connect(audio.musicGain);
      osc.start(startTime);
      osc.stop(startTime + duration + .04);

      audio.activeNodes.push({osc,gain});
    }

    function scheduleAdventureLoop(startTime){
      const eighth = .2;
      const melody = [523,659,784,659,587,698,880,698,659,784,1046,784,587,659,784,988,1046,988,880,784,698,784,880,1046,988,784,659,587,659,784,659,523];
      const bass = [130,130,196,196,146,146,220,220];
      const chords = [
        [262,330,392],
        [392,494,587],
        [294,349,440],
        [349,440,523]
      ];

      melody.forEach((f,i)=>scheduleMusicNote(f,startTime + i * eighth,.16,"triangle",.18));

      bass.forEach((f,i)=>{
        scheduleMusicNote(f,startTime + i * .8,.36,"square",.09);
        scheduleMusicNote(f * 1.5,startTime + i * .8 + .4,.22,"square",.045);
      });

      chords.forEach((c,i)=>{
        c.forEach(f=>scheduleMusicNote(f,startTime + i * 1.6,1.05,"sine",.035));
      });

      for(let i=0;i<32;i++){
        const t = startTime + i * eighth;
        if(i % 4 === 0) scheduleDrum(t,"kick");
        else if(i % 4 === 2) scheduleDrum(t,"snare");
        else scheduleDrum(t,"hat");
      }
    }

    function scheduleVictoryLoop(startTime){
      const eighth = .18;
      const melody = [784,988,1175,1318,1175,988,1046,1318,1568,1318,1175,1046,988,1175,1318,1568,1760,1568,1318,1175,1318,1568,1760,2093,1760,1568,1318];
      const bass = [196,262,220,294,262,330];
      const chords = [
        [392,494,587],
        [523,659,784],
        [440,554,659],
        [587,740,880]
      ];

      melody.forEach((f,i)=>scheduleMusicNote(f,startTime + i * eighth,.14,"triangle",.2));
      bass.forEach((f,i)=>scheduleMusicNote(f,startTime + i * .72,.30,"square",.08));

      chords.forEach((c,i)=>{
        c.forEach(f=>scheduleMusicNote(f,startTime + i * 1.2,.82,"sine",.045));
      });

      for(let i=0;i<24;i++){
        const t = startTime + i * eighth;
        if(i % 4 === 0) scheduleDrum(t,"kick");
        else if(i % 4 === 2) scheduleDrum(t,"snare");
        else scheduleDrum(t,"hat");
      }
    }

    function startMusic(){
      if(!audio.enabled) return;
      initAudio();
      if(!audio.ctx) return;

      if(audio.victoryTimer){
        clearInterval(audio.victoryTimer);
        audio.victoryTimer = null;
      }

      if(audio.musicTimer) return;

      audio.nextMusicTime = audio.ctx.currentTime + .05;
      scheduleAdventureLoop(audio.nextMusicTime);
      audio.nextMusicTime += audio.musicLoopSeconds;

      audio.musicTimer = setInterval(()=>{
        if(!audio.enabled || !audio.ctx) return;
        if(audio.ctx.state === "suspended") audio.ctx.resume();

        while(audio.nextMusicTime < audio.ctx.currentTime + 1){
          scheduleAdventureLoop(audio.nextMusicTime);
          audio.nextMusicTime += audio.musicLoopSeconds;
        }
      },500);
    }

    function stopMusic(){
      if(audio.musicTimer){
        clearInterval(audio.musicTimer);
        audio.musicTimer = null;
      }
    }

    function startVictoryMusic(){
      if(!audio.enabled) return;
      initAudio();
      if(!audio.ctx) return;

      stopMusic();
      stopAllNodes();

      if(audio.victoryTimer) return;

      audio.nextVictoryTime = audio.ctx.currentTime + .05;
      scheduleVictoryLoop(audio.nextVictoryTime);
      audio.nextVictoryTime += audio.victoryLoopSeconds;

      audio.victoryTimer = setInterval(()=>{
        if(!audio.enabled || !audio.ctx) return;
        if(audio.ctx.state === "suspended") audio.ctx.resume();

        while(audio.nextVictoryTime < audio.ctx.currentTime + 1){
          scheduleVictoryLoop(audio.nextVictoryTime);
          audio.nextVictoryTime += audio.victoryLoopSeconds;
        }
      },500);
    }

    function stopVictoryMusic(){

    function createChoiceButton(item,index,kind,selected){
      const btn = document.createElement("button");
      btn.type = "button";
      btn.className = selected ? "choice selected" : "choice";
      btn.dataset.kind = kind;
      btn.dataset.index = String(index);

      const wrap = document.createElement("div");
      wrap.className = item.image ? "choice-img-wrap" : "choice-emoji";

      if(item.image){
        const img = document.createElement("img");
        img.src = item.image;
        img.alt = item.label;
        img.className = "choice-img";
        wrap.appendChild(img);
      }else{
        wrap.textContent = item.emoji;
      }

      const label = document.createElement("span");
      label.className = "choice-label";
      label.textContent = item.label;

      const type = document.createElement("small");
      type.className = "choice-type";
      type.textContent = item.type || "";

      btn.appendChild(wrap);
      btn.appendChild(label);
      if(item.type) btn.appendChild(type);

      btn.addEventListener("click",()=>{
        document.querySelectorAll('.choice[data-kind="' + kind + '"]').forEach(el=>el.classList.remove("selected"));
        btn.classList.add("selected");

        if(kind === "hero") game.selectedHero = heroOptions[index];
        if(kind === "pet") game.selectedPet = petOptions[index];
      });

      return btn;
    }

    function updateHud(){
      dom.livesBox.textContent = "❤️".repeat(game.lives) + "🤍".repeat(Math.max(0,3 - game.lives));

      const stage = stages[game.stageIndex];
      if(stage){
        dom.stageBox.textContent = "第 " + stage.stage + " 關｜" + stage.name;
        dom.hintBox.textContent = "進度：" + (game.stageIndex + 1) + " / " + stages.length;
      }else{
        dom.stageBox.textContent = "任務完成";
        dom.hintBox.textContent = "進度：完成";
      }

      monsterEls.forEach((item,index)=>{
        if(index === game.stageIndex){
          const hpPercent = Math.max(0,(game.currentHp / game.maxHp) * 100);
          item.hpFill.style.width = hpPercent + "%";
        }
      });

      progressEls.forEach((dot,index)=>{
        dot.classList.remove("done","current");
        if(game.defeatedStages.has(index)) dot.classList.add("done");
        else if(index === game.stageIndex) dot.classList.add("current");
      });
    }

    function prepareStage(){
      const stage = stages[game.stageIndex];
      game.currentHp = stage.hp;
      game.maxHp = stage.hp;
      game.questionIndex = 0;

      monsterEls.forEach((item,index)=>{
        const defeated = game.defeatedStages.has(index);
        item.hpFill.style.width = defeated ? "0%" : "100%";
        item.root.classList.remove("hit","attacking");
        item.root.classList.toggle("dead",defeated);
        item.root.style.opacity = "1";
      });

      updateHud();
    }

    function startGame(){
      initAudio();
      stopVictoryMusic();

      game.lives = 3;
      game.stageIndex = 0;

      game.waitingAction = null;
      game.isBusy = false;
      game.actorX = START_X;
      game.defeatedStages = new Set();

      dom.startScreen.classList.add("hidden");
      dom.endScreen.classList.add("hidden");
      dom.gameScreen.classList.remove("hidden");

      renderActor(game.selectedHero);
      dom.petEmoji.textContent = game.selectedPet.emoji;
      dom.petCage.className = "pet-cage";

      prepareStage();
      setActorX(START_X,false);

      showToast("勇者出發！一路向右前進！");
      setTimeout(walkToMonster,650);
    }

    function walkToMonster(){
      if(game.isBusy) return;
      const stage = stages[game.stageIndex];
      if(!stage) return;

      game.isBusy = true;
      dom.actor.classList.add("walking");

      setActorX(stage.x - HERO_OFFSET_FROM_MONSTER,true);

      setTimeout(()=>{
        dom.actor.classList.remove("walking");
        game.isBusy = false;
        showQuestion();
      },4900);
    }

    function getCurrentQuestion(){
      return stages[game.stageIndex].questions[game.questionIndex];
    }

    function showQuestion(){
      const stage = stages[game.stageIndex];
      const q = getCurrentQuestion();
      if(!stage || !q) return;

      playQuestionSound();

      dom.modalStage.textContent = "第 " + stage.stage + " 關｜" + q.topic + "挑戰";
      dom.situationText.innerHTML = "<strong>情境：</strong>" + escapeHtml(q.situation);
      dom.questionText.textContent = q.question;
      dom.answersBox.textContent = "";

      q.options.forEach((text,index)=>{
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "answer-btn";
        btn.textContent = text;
        btn.addEventListener("click",()=>answerQuestion(index));
        dom.answersBox.appendChild(btn);
      });

      dom.questionModal.classList.remove("hidden");
    }

    function answerQuestion(index){
      const q = getCurrentQuestion();
      if(!q) return;

      dom.questionModal.classList.add("hidden");

      if(index === q.answer){
        handleCorrect(q);
      }else{
        handleWrong(q);
      }
    }

    function handleCorrect(q){
      playCorrectSound();

      game.currentHp -= 1;
      game.questionIndex += 1;
      updateHud();

      const currentMonster = monsterEls[game.stageIndex].root;
      const defeated = game.currentHp <= 0;

      dom.actor.classList.add("attacking");
      currentMonster.classList.remove("hit","dead");

      showToast("答對！武器命中，發動斬擊！");
      playSlashSound();

      setTimeout(()=>{
        if(defeated){
          playKillSound();
          currentMonster.classList.add("dead");
          game.defeatedStages.add(game.stageIndex);
        }else{
          currentMonster.classList.add("hit");
        }
      },650);

      setTimeout(()=>{
        dom.actor.classList.remove("attacking");
        currentMonster.classList.remove("hit");

        const damageText = game.maxHp === 1
          ? "直接擊敗怪物！"
          : "怪物扣血成功，目前血量 " + Math.max(0,game.currentHp) + "/" + game.maxHp + "。";

        showFeedback(true,q,damageText,defeated ? "stageClear" : "nextQuestion");
      },1500);
    }

    function handleWrong(q){
      game.lives -= 1;
      updateHud();
      showHeartLoss();

      const currentMonster = monsterEls[game.stageIndex].root;
      currentMonster.classList.add("attacking");
      dom.actor.classList.add("hurt");

      showToast("答錯了！怪物發動攻擊！");
      playMonsterAttackSound();
      playWrongSound();

      setTimeout(()=>{
        currentMonster.classList.remove("attacking");
        dom.actor.classList.remove("hurt");

        if(game.lives <= 0){
          gameOver();
          return;
        }

        showFeedback(false,q,"這一題尚未通過，請穩住陣腳，再試一次。","retry");
      },3000);
    }

    function showFeedback(isCorrect,q,extraText,action){
      game.waitingAction = action;

      dom.feedbackTitle.textContent = isCorrect ? "✅ 答對了！" : "❌ 答錯了！";
      dom.feedbackBody.className = isCorrect ? "feedback good" : "feedback bad";

      const tipLabel = isCorrect ? "教育重點" : "小提示";

      dom.feedbackBody.innerHTML =
        '<p><strong>' + (isCorrect ? "攻擊成功" : "生命值扣除") + '</strong>：' + escapeHtml(extraText) + '</p>' +
        '<div class="edu-point"><strong>' + tipLabel + '：</strong>' + escapeHtml(q.explain) + '</div>';

      if(action === "stageClear" && game.stageIndex === stages.length - 1){
        dom.continueBtn.textContent = "前往拯救寵物";
      }else if(action === "stageClear"){
        dom.continueBtn.textContent = "繼續往前，前往下一關";
      }else{
        dom.continueBtn.textContent = "繼續挑戰";
      }

      dom.feedbackModal.classList.remove("hidden");
    }

    function continueGame(){
      initAudio();
      dom.feedbackModal.classList.add("hidden");

      const action = game.waitingAction;
      game.waitingAction = null;

      if(action === "stageClear"){
        setTimeout(nextStage,450);
      }else if(action === "nextQuestion" || action === "retry"){
        setTimeout(showQuestion,350);
      }
    }

    function nextStage(){
      game.stageIndex += 1;
      updateHud();

      if(game.stageIndex >= stages.length){
        rescuePet();
        return;
      }

      prepareStage();
      showToast("過關！不回頭，繼續往前走到第 " + (game.stageIndex + 1) + " 關！");
      setTimeout(walkToMonster,650);
    }

    function rescuePet(){
      startVictoryMusic();

      dom.stageBox.textContent = "最終任務";
      dom.hintBox.textContent = "進度：救援";

      showToast("魔王倒下了！往前衝，救出寵物！");
      dom.actor.classList.add("walking");
      setActorX(PET_X - 88,true);

      setTimeout(()=>{
        dom.actor.classList.remove("walking");
        dom.actor.classList.add("rescue");
        dom.petCage.classList.add("open");
        playRescueSound();
        showToast("救援成功！寵物自由了！");

        setTimeout(()=>showEnd(true),1900);
      },4900);
    }

    function gameOver(){
      dom.questionModal.classList.add("hidden");
      dom.feedbackModal.classList.add("hidden");
      showEnd(false);
    }

    function returnToCharacterSelect(){
      stopMusic();
      stopVictoryMusic();
      stopAllNodes();

      dom.questionModal.classList.add("hidden");
      dom.feedbackModal.classList.add("hidden");
      dom.gameScreen.classList.add("hidden");
      dom.endScreen.classList.add("hidden");
      dom.startScreen.classList.remove("hidden");

      game.lives = 3;
      game.stageIndex = 0;
      game.questionIndex = 0;
      game.waitingAction = null;
      game.isBusy = false;
      game.actorX = START_X;
      game.defeatedStages = new Set();
    }

    function createEndHeroElement(role){
      const holder = document.createElement("div");
      holder.className = "victory-hero";

      if(role.image){
        const img = document.createElement("img");
        img.src = role.image;
        img.alt = role.label;
        holder.appendChild(img);
      }else{
        const span = document.createElement("span");
        span.className = "emoji-hero";
        span.textContent = role.emoji || "🙂";
        holder.appendChild(span);
      }
      return holder;
    }

    function showEnd(win){
      dom.gameScreen.classList.add("hidden");
      dom.endScreen.classList.remove("hidden");
      dom.endCard.textContent = "";

      if(win){
        const scene = document.createElement("div");
        scene.className = "victory-scene";

        const cannonLeft = document.createElement("div");
        cannonLeft.className = "victory-cannon left";
        cannonLeft.textContent = "🎉";

        const cannonRight = document.createElement("div");
        cannonRight.className = "victory-cannon right";
        cannonRight.textContent = "🎉";

        const pet = document.createElement("div");
        pet.className = "victory-pet";
        pet.textContent = game.selectedPet.emoji;

        scene.appendChild(cannonLeft);
        scene.appendChild(createEndHeroElement(game.selectedHero));
        scene.appendChild(pet);
        scene.appendChild(cannonRight);

        const title = document.createElement("h1");
        title.textContent = "🎉 救援成功！";

        const p = document.createElement("p");
        p.textContent = "你成功擊敗五隻健康怪物，順利救出心愛的寵物。透過這個遊戲，也了解了大學生常見的健康知識，包括飲食、飲水、運動、睡眠、壓力調適與生活習慣等重要觀念。";

        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "restart-btn";
        btn.textContent = "再玩一次";
        btn.addEventListener("click",startGame);

        const selectAgainBtn = document.createElement("button");
        selectAgainBtn.type = "button";
        selectAgainBtn.className = "select-again-btn";
        selectAgainBtn.textContent = "重新選角色";
        selectAgainBtn.addEventListener("click",returnToCharacterSelect);

        dom.endCard.appendChild(scene);
        dom.endCard.appendChild(title);
        dom.endCard.appendChild(p);
        dom.endCard.appendChild(btn);
        dom.endCard.appendChild(selectAgainBtn);
        return;
      }

      const emoji = document.createElement("div");
      emoji.className = "end-emoji";
      emoji.textContent = "💔";

      const title = document.createElement("h1");
      title.textContent = "挑戰失敗";

      const p = document.createElement("p");
      p.textContent = "三條生命值已用完。不過健康學習本來就需要反覆練習，重新整理策略後，再次出發仍能捲土重來。";

      const btn = document.createElement("button");
      btn.type = "button";
      btn.className = "restart-btn";
      btn.textContent = "重新挑戰";
      btn.addEventListener("click",startGame);

      const selectAgainBtn = document.createElement("button");
      selectAgainBtn.type = "button";
      selectAgainBtn.className = "select-again-btn";
      selectAgainBtn.textContent = "重新選角色";
      selectAgainBtn.addEventListener("click",returnToCharacterSelect);

      dom.endCard.appendChild(emoji);
      dom.endCard.appendChild(title);
      dom.endCard.appendChild(p);
      dom.endCard.appendChild(btn);
      dom.endCard.appendChild(selectAgainBtn);
    }

    function runSelfTests(){
      console.assert(heroOptions.length >= 2,"角色選項應至少有 2 個");
      console.assert(petOptions.length >= 2,"寵物選項應至少有 2 個");
      console.assert(stages.length === 5,"遊戲應有 5 個關卡");
      console.assert(stages[3].questions.length === 2,"第 4 關應有 2 題");
      console.assert(stages[4].questions.length === 3,"第 5 關應有 3 題");

      for(let i=1;i<stages.length;i++){
        console.assert(stages[i].x > stages[i - 1].x,"關卡位置必須由左至右遞增");
      }

      stages.forEach(stage=>{
        stage.questions.forEach(q=>{
          console.assert(q.answer >= 0 && q.answer < q.options.length,"每題答案索引必須有效");
        });
      });

      console.assert(PET_X > stages[stages.length - 1].x,"寵物位置必須在最後 Boss 右方");
      console.assert(typeof WARRIOR_IMG === "string" && WARRIOR_IMG.startsWith("data:image/svg+xml"),"勇士圖應成功內建成 data URI");
    }

    function init(){
      initDom();
      runSelfTests();
      renderChoices();
      renderWorldObjects();
      updateSoundButton();

      dom.startBtn.addEventListener("click",startGame);
      dom.continueBtn.addEventListener("click",continueGame);
      dom.soundBtn.addEventListener("click",()=>setSoundEnabled(!audio.enabled));
      window.addEventListener("resize",()=>updateCamera(game.actorX));
    }

    if(document.readyState === "loading"){
      document.addEventListener("DOMContentLoaded",init);
    }else{
      init();
    }
  </script>
</body>
</html>
